version: "3.9"

services:
  # -------------------------------------------------------------------------
  # PostgreSQL (mirrors Amazon RDS in local dev)
  # -------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pricewatch
      POSTGRES_USER: pricewatch
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricewatch"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # Redis (mirrors Amazon ElastiCache in local dev)
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # FastAPI backend
  # -------------------------------------------------------------------------
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file: ../backend/.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # -------------------------------------------------------------------------
  # DB migrations (runs once on startup)
  # -------------------------------------------------------------------------
  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file: ../backend/.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../backend:/app
    command: alembic upgrade head
    restart: "no"

  # -------------------------------------------------------------------------
  # Celery worker (scraping)
  # -------------------------------------------------------------------------
  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        INSTALL_PLAYWRIGHT: "true"
    env_file: ../backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4

  # -------------------------------------------------------------------------
  # Celery Beat scheduler (local dev only)
  # -------------------------------------------------------------------------
  beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file: ../backend/.env
    depends_on:
      - redis
    volumes:
      - ../backend:/app
    command: celery -A app.workers.celery_app beat --loglevel=info

  # -------------------------------------------------------------------------
  # Next.js frontend
  # -------------------------------------------------------------------------
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../frontend:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_COGNITO_REGION: eu-west-1
      NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      NEXT_PUBLIC_COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}

volumes:
  pg_data:
